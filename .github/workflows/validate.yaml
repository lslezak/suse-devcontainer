name: "Validate Templates"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # devcontainers/action does not validate templates, with "validate-only"
      # it always validates features and fails when "base-path-to-features"
      # is not set, just check the JSON syntax
      - name: "Check devcontainer-template.json files"
        run: |
          for template in src/*/devcontainer-template.json; do
            jq empty "$template" || exit 1
          done

      - name: "Validate devcontainer-feature.json files (opensuse)"
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src/opensuse/.devcontainer/features"

      - name: "Validate devcontainer-feature.json files (agama)"
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src/agama/.devcontainer/features"

      # each template must contain its own copy of the shared features
      - name: "Check the shared features are in sync"
        run: |
          for feature in gemini-true gemini-false claude-true claude-false; do
            diff -r "src/opensuse/.devcontainer/features/$feature" "src/agama/.devcontainer/features/$feature"
          done

      - name: "Check shell scripts"
        run: shellcheck -x test/*.sh test/*/*.sh src/*/.devcontainer/features/*/*.sh

      # hadolint/hadolint-action skips the hidden .devcontainer directories
      # in the recursive mode, run the hadolint image directly
      - name: "Check Dockerfiles"
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work hadolint/hadolint:v2.15.1 \
            /bin/hadolint --config .hadolint.yaml src/*/.devcontainer/Dockerfile
