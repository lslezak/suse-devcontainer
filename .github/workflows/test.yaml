name: "Test Templates"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: opensuse
            options: imageVariant=leap:16.0
          - template: opensuse
            options: imageVariant=tumbleweed
          - template: opensuse
            options: googleGemini=false anthropicClaude=false
          - template: agama
            options: agamaVariant=all-in-one
          - template: agama
            options: agamaVariant=all-in-one imageVariant=tumbleweed
          - template: agama
            options: agamaVariant=base mdns=false googleGemini=false anthropicClaude=false
          - template: agama
            options: agamaVariant=kiwi
          - template: agama
            options: agamaVariant=ruby
          - template: agama
            options: agamaVariant=rust
          - template: agama
            options: agamaVariant=web
    name: "${{ matrix.template }} (${{ matrix.options }})"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: "Install the devcontainer CLI"
        run: npm install -g @devcontainers/cli

      # the mDNS feature bind mounts the host Avahi daemon directory
      - name: "Create the Avahi daemon directory"
        run: sudo mkdir -p /run/avahi-daemon

      # the template uses Podman specific options
      - name: "Smoke test"
        env:
          CONTAINER_ENGINE: podman
        run: test/smoke-test.sh "${{ matrix.template }}" ${{ matrix.options }}
